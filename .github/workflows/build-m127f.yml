name: Build M127F Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            zip \
            unzip \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Download Android Clang r383902
        run: |
          mkdir -p "$HOME/toolchain"

          curl -L \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" \
            -o /tmp/clang-r383902.tar.gz

          tar -xf /tmp/clang-r383902.tar.gz \
            -C "$HOME/toolchain"

          echo "=== Clang version ==="
          "$HOME/toolchain/bin/clang" --version

          echo "=== AArch64 GNU linker ==="
          aarch64-linux-gnu-ld --version | head

      - name: Update KernelSU Next submodule
        run: |
          cd KernelSU-Next

          echo "=== KernelSU remotes ==="
          git remote -v

          git fetch origin

          echo "=== Switching to latest legacy branch ==="
          git checkout -B legacy origin/legacy

          echo "=== KernelSU commit ==="
          git rev-parse HEAD
          git log -1 --oneline

          cd ..

      - name: Fix strscpy_pad compatibility for Samsung 4.19
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("KernelSU-Next/kernel/compat/kernel_compat.h")
          s = p.read_text()

          old = """#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 14, 222)
              return strscpy_pad(dest, src, count);
          #elif LINUX_VERSION_CODE >= KERNEL_VERSION(4, 3, 0)"""

          new = """#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 0, 0)
              return strscpy_pad(dest, src, count);
          #elif LINUX_VERSION_CODE >= KERNEL_VERSION(4, 3, 0)"""

          if old not in s:
              raise SystemExit(
                  "Expected strscpy_pad compatibility block not found"
              )

          p.write_text(s.replace(old, new, 1))

          print("Forced Samsung 4.19 to use KSUN strscpy fallback")
          PY

          echo "=== Patched strscpy compatibility code ==="
          grep -n -A15 -B3 \
            "static inline ssize_t __strscpy_pad" \
            KernelSU-Next/kernel/compat/kernel_compat.h

      - name: Configure M127F kernel
        run: |
          export PATH="$HOME/toolchain/bin:$PATH"

          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            exynos850-m12nsxx_defconfig

      - name: Show KernelSU config
        run: |
          echo "=== KernelSU config ==="
          grep -iE "KSU|KERNELSU" .config || true

          echo "=== SUSFS config ==="
          grep -i "SUSFS" .config || true

      - name: Verify compiler environment
        run: |
          export PATH="$HOME/toolchain/bin:$PATH"

          echo "=== clang ==="
          which clang
          clang --version

          echo "=== linker ==="
          which aarch64-linux-gnu-ld
          aarch64-linux-gnu-ld --version | head

          echo "=== assembler ==="
          which aarch64-linux-gnu-as
          aarch64-linux-gnu-as --version | head

          echo "=== compiler target test ==="
          echo | clang \
            --target=aarch64-linux-gnu \
            -dM -E - \
            | grep -E "__aarch64__|__AARCH64"

      - name: Build M127F kernel
        run: |
          export PATH="$HOME/toolchain/bin:$PATH"

          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc)

      - name: Verify kernel image
        run: |
          echo "=== arch/arm64/boot ==="
          ls -lah arch/arm64/boot/

          echo "=== Searching for kernel images ==="
          find arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
            \) \
            -ls

          test -f arch/arm64/boot/Image

      - name: Prepare AnyKernel package
        run: |
          rm -rf output
          mkdir -p output

          cp -a anykernel/. output/
          cp arch/arm64/boot/Image output/Image

          echo "=== AnyKernel contents ==="
          ls -lah output/

      - name: Create flashable ZIP
        run: |
          cd output
          zip -r ../M127F-KSUN-Latest.zip .

      - name: Upload flashable kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-Latest
          path: M127F-KSUN-Latest.zip

      - name: Upload build config
        uses: actions/upload-artifact@v4
        with:
          name: M127F-Kernel-Config
          path: .config
