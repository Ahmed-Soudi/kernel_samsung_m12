name: Build M127F Kernel - KSUN v3.3.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            zip \
            unzip \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Download Android Clang r383902
        run: |
          mkdir -p "$HOME/toolchain"

          curl -L \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" \
            -o /tmp/clang-r383902.tar.gz

          tar -xf /tmp/clang-r383902.tar.gz \
            -C "$HOME/toolchain"

          echo "=== Clang version ==="
          "$HOME/toolchain/bin/clang" --version

          echo "=== AArch64 GNU linker ==="
          aarch64-linux-gnu-ld --version | head

      - name: Integrate KernelSU-Next v3.3.0
        run: |
          set -euxo pipefail

          echo "=== Initialize KernelSU-Next submodule ==="
          git submodule sync --recursive
          git submodule update --init --recursive

          echo "=== Set official KernelSU-Next remote ==="
          git -C KernelSU-Next remote set-url origin \
            https://github.com/KernelSU-Next/KernelSU-Next.git

          git -C KernelSU-Next fetch --tags --force origin

          echo "=== Remove stale drivers/kernelsu link if present ==="
          rm -rf drivers/kernelsu

          echo "=== Run official KSUN v3.3.0 setup ==="
          sh KernelSU-Next/kernel/setup.sh v3.3.0

          echo "=== Verify exact KernelSU-Next version ==="
          git -C KernelSU-Next describe --tags --exact-match
          git -C KernelSU-Next rev-parse HEAD
          git -C KernelSU-Next log -1 --oneline

          test "$(git -C KernelSU-Next describe --tags --exact-match)" = "v3.3.0"

          echo "=== Verify drivers/kernelsu integration ==="
          ls -ld drivers/kernelsu
          readlink -f drivers/kernelsu

          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          echo "=== Verify Makefile integration ==="
          grep -n "kernelsu" drivers/Makefile

          echo "=== Verify Kconfig integration ==="
          grep -n "drivers/kernelsu/Kconfig" drivers/Kconfig

          echo "=== KernelSU-Next v3.3.0 integrated successfully ==="

      - name: Verify native SELinux Hide is present
        run: |
          set -euxo pipefail

          test -f KernelSU-Next/kernel/feature/selinux_hide.c
          test -f KernelSU-Next/kernel/feature/selinux_hide.h

          echo "=== SELinux Hide init ==="
          grep -n "ksu_selinux_hide_init" \
            KernelSU-Next/kernel/feature/selinux_hide.c

          echo "=== SELinux Hide feature ID ==="
          grep -n "KSU_FEATURE_SELINUX_HIDE" \
            KernelSU-Next/kernel/feature/selinux_hide.c

          echo "=== SELinux Hide LSM integration ==="
          grep -n "ksu_lsm_hook" \
            KernelSU-Next/kernel/feature/selinux_hide.c || true

          echo "=== SELinux write_op integration ==="
          grep -n 'find_kernel_symbol_exact("write_op")' \
            KernelSU-Next/kernel/feature/selinux_hide.c || true

          echo "=== SELinux Hide source references ==="
          grep -R -n "selinux_hide" \
            KernelSU-Next/kernel \
            2>/dev/null | head -n 100 || true

          echo "=== Native SELinux Hide source verified in v3.3.0 ==="

      - name: Configure M127F kernel
        run: |
          set -euxo pipefail

          export PATH="$HOME/toolchain/bin:$PATH"

          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            exynos850-m12nsxx_defconfig

      - name: Verify M127F and KernelSU configuration
        run: |
          set -euxo pipefail

          echo "=== KernelSU config ==="
          grep -iE "CONFIG_(KSU|KERNELSU)" .config || true

          echo "=== SELinux config ==="
          grep -i "CONFIG_SECURITY_SELINUX" .config || true

          echo "=== Kprobe config ==="
          grep -i "KPROBE" .config || true

          echo "=== SUSFS config ==="
          grep -i "SUSFS" .config || true

          echo "=== Required KernelSU setting ==="
          grep '^CONFIG_KSU=y$' .config

          echo "=== Manual hook setting ==="
          grep '^CONFIG_KSU_MANUAL_HOOK=y$' .config || true

          echo "=== KPM setting ==="
          grep '^CONFIG_KPM=y$' .config || true

          echo "=== Configuration verification complete ==="

      - name: Verify compiler environment
        run: |
          set -euxo pipefail

          export PATH="$HOME/toolchain/bin:$PATH"

          echo "=== clang ==="
          which clang
          clang --version

          echo "=== linker ==="
          which aarch64-linux-gnu-ld
          aarch64-linux-gnu-ld --version | head

          echo "=== assembler ==="
          which aarch64-linux-gnu-as
          aarch64-linux-gnu-as --version | head

          echo "=== compiler target test ==="
          echo | clang \
            --target=aarch64-linux-gnu \
            -dM -E - \
            | grep -E "__aarch64__|__AARCH64"

      - name: Build M127F kernel
        run: |
          set -euxo pipefail

          export PATH="$HOME/toolchain/bin:$PATH"

          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc)

      - name: Verify v3.3.0 SELinux Hide was compiled
        run: |
          set -euxo pipefail

          echo "=== Search SELinux Hide object ==="

          find . \
            -type f \
            -name "*selinux_hide*.o" \
            -print 2>/dev/null || true

          SELINUX_HIDE_OBJECT="$(
            find . \
              -type f \
              -name "*selinux_hide*.o" \
              -print -quit 2>/dev/null
          )"

          if [ -n "$SELINUX_HIDE_OBJECT" ]; then
            echo "=== SUCCESS: Native SELinux Hide compiled ==="
            echo "$SELINUX_HIDE_OBJECT"
            ls -lh "$SELINUX_HIDE_OBJECT"
          else
            echo "ERROR: Native SELinux Hide source exists but no compiled object was found."
            echo "KernelSU may not actually have been linked into this build."
            exit 1
          fi

      - name: Verify KernelSU objects were compiled
        run: |
          set -euxo pipefail

          echo "=== KernelSU build products ==="

          find . \
            -type f \
            \( \
              -name "kernelsu.o" \
              -o -name "built-in.a" \
              -o -name "*ksu*.o" \
            \) \
            2>/dev/null | grep -E "KernelSU|kernelsu" | head -n 100 || true

          echo "=== drivers/kernelsu ==="
          ls -la drivers/kernelsu

          echo "=== KernelSU feature directory ==="
          ls -la drivers/kernelsu/feature || true

      - name: Verify kernel image
        run: |
          set -euxo pipefail

          echo "=== arch/arm64/boot ==="
          ls -lah arch/arm64/boot/

          echo "=== Searching for kernel images ==="

          find arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
            \) \
            -ls

          test -f arch/arm64/boot/Image

          echo "=== Kernel Image ==="
          ls -lh arch/arm64/boot/Image

      - name: Prepare AnyKernel package
        run: |
          set -euxo pipefail

          rm -rf output
          mkdir -p output

          cp -a anykernel/. output/
          cp arch/arm64/boot/Image output/Image

          echo "=== AnyKernel contents ==="
          ls -lah output/

          echo "=== Packaged kernel Image ==="
          ls -lh output/Image

      - name: Create flashable ZIP
        run: |
          set -euxo pipefail

          cd output

          zip -r9 \
            ../M127F-KSUN-v3.3.0-SELinuxHide.zip \
            .

          cd ..

          echo "=== Flashable ZIP ==="
          ls -lh M127F-KSUN-v3.3.0-SELinuxHide.zip

      - name: Upload flashable kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-SELinuxHide
          path: M127F-KSUN-v3.3.0-SELinuxHide.zip
          compression-level: 0

      - name: Upload build config
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-Config
          path: .config

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-Diagnostics
          path: |
            .config
            KernelSU-Next/kernel/feature/selinux_hide.c
          if-no-files-found: ignore
