name: Build M127F Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            zip \
            unzip

      - name: Integrate latest KernelSU Next legacy
        run: |
          rm -rf KernelSU-Next

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

      - name: Configure M127F kernel
        run: |
          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64

          make ARCH=arm64 exynos850-m12nsxx_defconfig

      - name: Build M127F kernel
        run: |
          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64

          make ARCH=arm64 -j$(nproc)

      - name: Verify kernel image
        run: |
          ls -lh arch/arm64/boot/

          test -f arch/arm64/boot/Image

      - name: Prepare AnyKernel
        run: |
          rm -rf output
          mkdir output

          cp -a anykernel/. output/
          cp arch/arm64/boot/Image output/Image

      - name: Create flashable ZIP
        run: |
          cd output
          zip -r ../M127F-KSUN-Latest.zip .

      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-Latest
          path: M127F-KSUN-Latest.zip
