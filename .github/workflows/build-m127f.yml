name: Build M127F Kernel - KSUN v3.3.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            zip \
            unzip \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Download Android Clang r383902
        run: |
          mkdir -p "$HOME/toolchain"

          curl -L \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" \
            -o /tmp/clang-r383902.tar.gz

          tar -xf /tmp/clang-r383902.tar.gz \
            -C "$HOME/toolchain"

          echo "=== Clang version ==="
          "$HOME/toolchain/bin/clang" --version

          echo "=== AArch64 GNU linker ==="
          aarch64-linux-gnu-ld --version | head

      - name: Integrate KernelSU-Next v3.3.0
        run: |
          set -euxo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive

          git -C KernelSU-Next remote set-url origin \
            https://github.com/KernelSU-Next/KernelSU-Next.git

          git -C KernelSU-Next fetch --tags --force origin

          rm -rf drivers/kernelsu

          echo "=== Run official KSUN v3.3.0 setup ==="
          sh KernelSU-Next/kernel/setup.sh v3.3.0

          echo "=== Verify exact KernelSU-Next version ==="
          git -C KernelSU-Next describe --tags --exact-match
          git -C KernelSU-Next rev-parse HEAD
          git -C KernelSU-Next log -1 --oneline

          test "$(git -C KernelSU-Next describe --tags --exact-match)" = "v3.3.0"

          echo "=== Verify drivers/kernelsu integration ==="
          ls -ld drivers/kernelsu
          readlink -f drivers/kernelsu

          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          grep -n "kernelsu" drivers/Makefile
          grep -n "drivers/kernelsu/Kconfig" drivers/Kconfig

          echo "=== KernelSU-Next v3.3.0 integrated ==="

      - name: Verify native SELinux Hide is present
        run: |
          set -euxo pipefail

          test -f KernelSU-Next/kernel/feature/selinux_hide.c
          test -f KernelSU-Next/kernel/feature/selinux_hide.h

          echo "=== SELinux Hide init ==="
          grep -n "ksu_selinux_hide_init" \
            KernelSU-Next/kernel/feature/selinux_hide.c

          echo "=== SELinux Hide feature ID ==="
          grep -n "KSU_FEATURE_SELINUX_HIDE" \
            KernelSU-Next/kernel/feature/selinux_hide.c

          echo "=== SELinux Hide build integration ==="
          grep -n "feature/selinux_hide.o" \
            KernelSU-Next/kernel/Kbuild

          echo "=== SELinux Hide LSM hook ==="
          grep -n "ksu_lsm_hook" \
            KernelSU-Next/kernel/feature/selinux_hide.c

          echo "=== SELinux write_op handling ==="
          grep -n 'find_kernel_symbol_exact("write_op")' \
            KernelSU-Next/kernel/feature/selinux_hide.c

          echo "=== Native SELinux Hide verified ==="

      - name: Apply Samsung 4.19 KSUN compatibility fixes
        run: |
          set -euxo pipefail

          echo "========================================="
          echo " Samsung 4.19 compatibility preparation"
          echo "========================================="

          echo
          echo "=== Compatibility #1: linux/pgtable.h ==="

          if [ ! -f include/linux/pgtable.h ]; then
            echo "Samsung kernel does not provide include/linux/pgtable.h"

            if grep -q '^#include <linux/pgtable.h>$' \
                 KernelSU-Next/kernel/feature/sucompat.c; then

              sed -i \
                '/^#include <linux\/pgtable\.h>$/d' \
                KernelSU-Next/kernel/feature/sucompat.c

              echo "Removed unused linux/pgtable.h include"
            fi
          fi

          echo
          echo "=== Compatibility #2: strncpy_from_user_nofault ==="

          if ! grep -R -q \
               "strncpy_from_user_nofault" \
               include arch/arm64/include 2>/dev/null; then

            echo "Kernel lacks strncpy_from_user_nofault"

            grep -R -n \
              "strncpy_from_user_nofault" \
              KernelSU-Next/kernel || true

            grep -R -l \
              "strncpy_from_user_nofault" \
              KernelSU-Next/kernel \
              | while read -r file; do

                  echo "Patching: $file"

                  sed -i \
                    's/strncpy_from_user_nofault/strncpy_from_user/g' \
                    "$file"
                done

            if grep -R -n \
                 "strncpy_from_user_nofault" \
                 KernelSU-Next/kernel; then

              echo "ERROR: unpatched references remain"
              exit 1
            fi
          fi

          echo
          echo "=== Compatibility #3: copy_to_kernel_nofault ==="

          if ! grep -R -q \
               "copy_to_kernel_nofault" \
               include arch/arm64/include lib 2>/dev/null; then

            echo "Samsung 4.19 lacks copy_to_kernel_nofault"

            echo "=== KSUN users ==="
            grep -R -n \
              "copy_to_kernel_nofault" \
              KernelSU-Next/kernel || true

            python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("KernelSU-Next/kernel/hook/arm64/patch_memory.c"),
              Path("KernelSU-Next/kernel/hook/x86_64/patch_memory.c"),
          ]

          compat = r'''
          /*
           * Samsung Linux 4.19 compatibility:
           *
           * Modern kernels provide copy_to_kernel_nofault().
           * This vendor 4.19 tree predates that helper.
           *
           * probe_kernel_write() provides the old-kernel equivalent
           * fault-protected kernel-memory write operation.
           */
          #ifndef copy_to_kernel_nofault
          static inline long ksu_copy_to_kernel_nofault(void *dst,
                                                        const void *src,
                                                        size_t size)
          {
              return probe_kernel_write(dst, src, size);
          }
          #define copy_to_kernel_nofault ksu_copy_to_kernel_nofault
          #endif

          '''

          for p in files:
              if not p.exists():
                  continue

              s = p.read_text()

              if "ksu_copy_to_kernel_nofault" in s:
                  print(f"{p}: compatibility helper already present")
                  continue

              marker = "#include"

              lines = s.splitlines(keepends=True)
              last_include = -1

              for i, line in enumerate(lines):
                  if line.startswith("#include"):
                      last_include = i

              if last_include < 0:
                  raise SystemExit(f"No include block found in {p}")

              lines.insert(last_include + 1, "\n" + compat)

              p.write_text("".join(lines))

              print(f"{p}: added Samsung 4.19 copy_to_kernel_nofault compatibility")
          PY

            echo "=== Verify compatibility helper ==="

            grep -R -n \
              "ksu_copy_to_kernel_nofault" \
              KernelSU-Next/kernel/hook || true
          else
            echo "Kernel already provides copy_to_kernel_nofault"
          fi

          echo
          echo "=== Remaining nofault APIs used by KSUN ==="

          grep -R -n \
            "_nofault" \
            KernelSU-Next/kernel \
            2>/dev/null || true

          echo
          echo "=== Samsung 4.19 compatibility stage complete ==="

      - name: Configure M127F base kernel
        run: |
          set -euxo pipefail

          export PATH="$HOME/toolchain/bin:$PATH"

          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            exynos850-m12nsxx_defconfig

      - name: Enable KSUN v3.3.0 requirements
        run: |
          set -euxo pipefail

          export PATH="$HOME/toolchain/bin:$PATH"

          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "=== Initial requirements ==="
          grep -E 'CONFIG_(KPROBES|KSU|EXT4_FS)' .config || true

          test -x scripts/config

          scripts/config --enable KPROBES
          scripts/config --enable KSU

          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo "=== Final requirements ==="
          grep -E 'CONFIG_(KPROBES|KSU|EXT4_FS)' .config || true

      - name: Verify M127F and KernelSU configuration
        run: |
          set -euxo pipefail

          echo "=== KernelSU ==="
          grep -iE "CONFIG_(KSU|KERNELSU)" .config || true

          echo "=== SELinux ==="
          grep -i "CONFIG_SECURITY_SELINUX" .config || true

          echo "=== Kprobes ==="
          grep -i "KPROBE" .config || true

          echo "=== Required settings ==="
          grep '^CONFIG_KPROBES=y$' .config
          grep '^CONFIG_EXT4_FS=y$' .config
          grep '^CONFIG_KSU=y$' .config

      - name: Verify compiler environment
        run: |
          set -euxo pipefail

          export PATH="$HOME/toolchain/bin:$PATH"

          which clang
          clang --version

          which aarch64-linux-gnu-ld
          aarch64-linux-gnu-ld --version | head

          which aarch64-linux-gnu-as
          aarch64-linux-gnu-as --version | head

          echo | clang \
            --target=aarch64-linux-gnu \
            -dM -E - \
            | grep -E "__aarch64__|__AARCH64"

      - name: Build M127F kernel
        run: |
          set -euxo pipefail

          export PATH="$HOME/toolchain/bin:$PATH"

          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc)

      - name: Verify v3.3.0 SELinux Hide was compiled
        run: |
          set -euxo pipefail

          echo "=== SELinux Hide objects ==="

          find . \
            -type f \
            -name "*selinux_hide*.o" \
            -print 2>/dev/null || true

          SELINUX_HIDE_OBJECT="$(
            find . \
              -type f \
              -name "*selinux_hide*.o" \
              -print -quit 2>/dev/null
          )"

          if [ -z "$SELINUX_HIDE_OBJECT" ]; then
            echo "ERROR: selinux_hide.o was not produced"
            exit 1
          fi

          echo "=== SUCCESS: Native SELinux Hide compiled ==="
          echo "$SELINUX_HIDE_OBJECT"
          ls -lh "$SELINUX_HIDE_OBJECT"

      - name: Verify KernelSU objects were compiled
        run: |
          set -euxo pipefail

          echo "=== KernelSU directory ==="
          ls -la drivers/kernelsu

          echo "=== KernelSU objects ==="

          find . \
            -type f \
            \( \
              -name "*ksu*.o" \
              -o -name "*kernelsu*.o" \
              -o -name "selinux_hide.o" \
            \) \
            -print 2>/dev/null | head -n 200 || true

      - name: Verify kernel image
        run: |
          set -euxo pipefail

          echo "=== arch/arm64/boot ==="
          ls -lah arch/arm64/boot/

          find arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
            \) \
            -ls

          test -f arch/arm64/boot/Image

          echo "=== Final Image ==="
          ls -lh arch/arm64/boot/Image

      - name: Prepare AnyKernel package
        run: |
          set -euxo pipefail

          rm -rf output
          mkdir -p output

          cp -a anykernel/. output/
          cp arch/arm64/boot/Image output/Image

          echo "=== AnyKernel ==="
          ls -lah output/

      - name: Create flashable ZIP
        run: |
          set -euxo pipefail

          cd output

          zip -r9 \
            ../M127F-KSUN-v3.3.0-SELinuxHide.zip \
            .

          cd ..

          ls -lh M127F-KSUN-v3.3.0-SELinuxHide.zip

      - name: Upload flashable kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-SELinuxHide
          path: M127F-KSUN-v3.3.0-SELinuxHide.zip
          compression-level: 0

      - name: Upload build config
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-Config
          path: .config
          include-hidden-files: true

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-Diagnostics
          path: |
            .config
            KernelSU-Next/kernel/feature/selinux_hide.c
            KernelSU-Next/kernel/feature/sucompat.c
            KernelSU-Next/kernel/hook/arm64/patch_memory.c
          if-no-files-found: ignore
          include-hidden-files: true
